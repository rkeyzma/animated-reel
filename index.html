<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Reel Effect</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    background: linear-gradient(-45deg, #1a1a1a, #0f2027, #203a43, #2c5364);
    background-size: 400% 400%;
    animation: gradientMove 8s ease infinite;
}

.container {
    text-align: center;
    color: white;
    padding: 20px;
}

h1 {
    font-size: 3rem;
    font-weight: 700;
    opacity: 0;
    transform: scale(0.5);
    animation: popIn 1s ease forwards;
}

p {
    margin-top: 20px;
    font-size: 1.4rem;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    animation-delay: 1s;
}

@keyframes popIn {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes fadeIn {
    to {
        opacity: 1;
    }
}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* Mobile Optimization */
@media (max-width: 600px) {
    h1 {
        font-size: 2.2rem;
    }
    p {
        font-size: 1.1rem;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1 id="nameText">Ashley</h1>
    <p id="sentenceText">You make everything feel effortless.</p>
</div>

<script>
// OPTIONAL: Change text dynamically here
document.getElementById("My Gabylii").textContent = "Yashwanth";
document.getElementById("Will you be my forever valentine in the Lord?").textContent = "The calm in every chaos.";
</script>

</body>
</html>
